baseURL: https://altjs4510.github.io/ai_news_blog/
title: AI News Digest
languageCode: ko
defaultContentLanguage: ko

enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Posts
      pageRef: /posts
      weight: 1
    - name: Knowledge
      pageRef: /knowledge
      weight: 2
    - name: Tags
      pageRef: /tags
      weight: 3
    - name: About
      pageRef: /about
      weight: 4
    - name: Search
      weight: 5
      params:
        type: search
    - name: RSS
      url: "/posts/index.xml"
      weight: 6
    - name: GitHub
      url: "https://github.com/altjs4510/ai_news_blog"
      weight: 7
      params:
        icon: github

taxonomies:
  tag: tags

params:
  description: "매주 월요일 자동 발행되는 AI 동향 큐레이션 — Anthropic·OpenAI·Google·DeepMind 공식 블로그, Reddit, Hacker News, Product Hunt, TechCrunch AI, arxiv, HuggingFace Papers, GitHub Trending"

  # 홈/태그/저자 등 listing 페이지의 'recent posts' 집합으로 사용할 섹션.
  # posts(주간 요약) + knowledge(학습 노트) 둘 다 메인 섹션으로 인정.
  mainSections:
    - posts
    - knowledge

  navbar:
    displayTitle: true
    displayLogo: false

  # page.width 미설정(default) — Hextra가 우측 sticky TOC를 자동 노출.
  # 본문 폭은 custom.css의 .ai-home-body(780px)에서 별도로 제한한다.

  theme:
    default: system
    displayToggle: true

  footer:
    displayCopyright: true
    displayPoweredBy: true

  editURL:
    enable: false
