baseURL: https://altjs4510.github.io/ai_news_blog/
title: AI News Digest
languageCode: ko
defaultContentLanguage: ko

enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true
buildFuture: true

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      # 헤딩에 자동 anchor id 생성 — 우측 sticky TOC가 .Fragments.Headings로
      # 헤딩을 추출할 수 있게 한다. (Hugo 기본은 true지만 명시적으로 박아둠)
      autoHeadingID: true
      autoHeadingIDType: github
  highlight:
    noClasses: false

menu:
  main:
    # 메뉴는 의도적으로 단순. Posts(주간 요약) + Knowledge(일간 픽 + 학습 노트)
    # 두 축으로 정리. Topics(/categories)는 해시태그 다중 분류라 클릭 부담이 컸기에 제거.
    # 카테고리 분류는 /knowledge/ 좌측 사이드바 트리에서 자연스럽게 도달.
    - name: Posts
      pageRef: /posts
      weight: 1
    - name: Knowledge
      pageRef: /knowledge
      weight: 2
    - name: About
      pageRef: /about
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: RSS
      url: "/posts/index.xml"
      weight: 5
    - name: GitHub
      url: "https://github.com/altjs4510/ai_news_blog"
      weight: 6
      params:
        icon: github

# tag(자유 키워드, 짧음, 다수) + category(주제 분류, 적은 수, 의미 그룹)을
# 별도 taxonomy로 운영. /categories/는 메뉴에 'Topics'로 노출된다.
taxonomies:
  tag: tags
  category: categories

params:
  # SNS 공유(OG / Twitter card) 폴백용. Hextra의 opengraph.html이
  # `Site.Params.title`로 og:site_name을 박고, 페이지 level description이
  # 비면 `Site.Params.description`을 폴백으로 쓴다.
  title: "AI News Digest"
  description: "매일 자동 발행되는 AI 동향 큐레이션. Anthropic · OpenAI · Google · DeepMind 공식 블로그, 전문가, 에이전트·툴, 뉴스레터, 커뮤니티, 연구·코드 30+ 소스에서 매일 24시간치 핵심을 정리합니다."

  # 홈/태그/저자 등 listing 페이지의 'recent posts' 집합으로 사용할 섹션.
  # posts(주간 요약) + knowledge(학습 노트) 둘 다 메인 섹션으로 인정.
  mainSections:
    - posts
    - knowledge

  navbar:
    displayTitle: true
    displayLogo: false

  # page.width 미설정(default) — Hextra가 우측 sticky TOC를 자동 노출.
  # 본문 폭은 custom.css의 .ai-home-body(780px)에서 별도로 제한한다.

  theme:
    default: system
    displayToggle: true

  footer:
    displayCopyright: true
    displayPoweredBy: true

  editURL:
    enable: false
