name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout for commit message lookup
        if: success()
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract latest published date from commit
        if: success()
        id: postmeta
        run: |
          msg=$(git log -1 --pretty=%s)
          date=$(echo "$msg" | grep -oE '[0-9]{8}' | head -1)
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "msg=$msg" >> "$GITHUB_OUTPUT"

      - name: Notify Slack on publish success
        if: success() && steps.postmeta.outputs.date != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DATE: ${{ steps.postmeta.outputs.date }}
          COMMIT_MSG: ${{ steps.postmeta.outputs.msg }}
        run: |
          POST_URL="https://altjs4510.github.io/ai_news_blog/posts/${DATE}/"
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\":white_check_mark: *AI News 발행 완료* (${DATE})\\n${POST_URL}\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\":x: *Quartz 빌드/배포 실패*\\n<${RUN_URL}|workflow run 보기>\"}" \
            "$SLACK_WEBHOOK_URL"

  notify-build-failure:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack on build failure
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\":x: *Quartz 빌드 실패*\\n<${RUN_URL}|workflow run 보기>\"}" \
            "$SLACK_WEBHOOK_URL"
